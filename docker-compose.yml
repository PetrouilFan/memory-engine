version: '3.8'

services:
  memory-engine:
    build: .
    ports:
      - "8000:8000"
      - "19192:19192"
    environment:
      - MEMORY_EMB_DIM=384
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
